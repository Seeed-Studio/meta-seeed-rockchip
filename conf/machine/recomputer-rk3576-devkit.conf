#@TYPE: Machine
#@NAME: Seeed reComputer RK3576 DevKit
#@DESCRIPTION: Seeed RK3576 development kit with eMMC, SD, SPI-NOR and M.2 NVMe.

# Use the Rockchip layer shipped inside the staged official SDK.  The SDK
# layer supplies the common RK3576 tune and Rockchip defaults; this machine
# keeps its own kernel/U-Boot recipes, mirroring the RK3588 setup.
require conf/machine/include/rk3576.inc
require conf/machine/include/recomputer-common.inc

PREFERRED_PROVIDER_virtual/kernel = "linux-seeed"

# The board DTB must stay the first entry: the balena integration derives
# UBOOT_EXTLINUX_FDT from the first word of this list.
#
# The dtbo entries are the vendor tree's board overlays for the 40-pin
# header, both camera seats, the HaLow module, the DP 4K routing and the
# Raspberry Pi 7" DSI panel.  They are opt-in - nothing is applied unless
# the boot environment selects it - and kernel-devicetree builds them from
# the vendor tree's dtbo-$(CONFIG_ARCH_ROCKCHIP) list.
KERNEL_DEVICETREE = " \
    rockchip/rk3576-recomputer-rk3576-devkit.dtb \
    rockchip/overlay/recomputer-rk3576-devkit-40pin-can0.dtbo \
    rockchip/overlay/recomputer-rk3576-devkit-40pin-can1.dtbo \
    rockchip/overlay/recomputer-rk3576-devkit-40pin-i2c3.dtbo \
    rockchip/overlay/recomputer-rk3576-devkit-40pin-pwm2-ch6.dtbo \
    rockchip/overlay/recomputer-rk3576-devkit-40pin-uart3.dtbo \
    rockchip/overlay/recomputer-rk3576-devkit-40pin-uart5.dtbo \
    rockchip/overlay/recomputer-rk3576-devkit-cam0-rpi-v2.dtbo \
    rockchip/overlay/recomputer-rk3576-devkit-cam0-rpi-v3.dtbo \
    rockchip/overlay/recomputer-rk3576-devkit-cam1-rpi-v2.dtbo \
    rockchip/overlay/recomputer-rk3576-devkit-cam1-rpi-v3.dtbo \
    rockchip/overlay/recomputer-rk3576-devkit-dp-4k.dtbo \
    rockchip/overlay/recomputer-rk3576-devkit-halow-wifi.dtbo \
    rockchip/overlay/recomputer-rk3576-devkit-raspi-7inch-touchscreen.dtbo \
"
UBOOT_EXTLINUX_FDT = "../rockchip/rk3576-recomputer-rk3576-devkit.dtb"
UBOOT_MACHINE = "recomputer-rk3576-devkit_defconfig"

# The two ethernet ports are SoC GMACs with RTL8211F PHYs (no NIC firmware
# needed, unlike the RK3588 devkit's PCIe RTL8125 pair).
# The rkaiq/rkisp camera 3A stack is the meta-rockchip source build
# (rockchip-rkaiq / rockchip-rkisp recipes), same as on RK3588.  This
# replaces Seeed's prebuilt camera-engine-rkaiq-rk3576 deb, which existed
# because the deb_source rk3576 closed 3A blobs did not link with the
# Wrynose toolchain (RK3588 phase-5 leftover #11); the meta-rockchip tree
# is a different source, so validate the camera on hardware after this
# switch.
IMAGE_INSTALL:append = " \
    rockchip-rkaiq-server \
    rockchip-rkaiq-iqfiles \
    rockchip-rkisp-server \
    rockchip-rkisp-iqfiles \
"
