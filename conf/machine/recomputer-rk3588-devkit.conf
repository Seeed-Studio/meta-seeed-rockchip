#@TYPE: Machine
#@NAME: Seeed reComputer RK3588 DevKit
#@DESCRIPTION: Seeed RK3588 development kit with eMMC, SD, SPI-NOR and NVMe.

# Use the Rockchip layer shipped inside the staged official SDK, not the
# Radxa meta-rockchip repository. The SDK layer supplies the common RK3588
# tune and Rockchip defaults; this machine keeps its own kernel/U-Boot recipes.
require conf/machine/include/rk3588.inc
require conf/machine/include/recomputer-common.inc

PREFERRED_PROVIDER_virtual/kernel = "linux-seeed"

# The board DTB must stay the first entry: the balena integration derives
# UBOOT_EXTLINUX_FDT from the first word of this list.
#
# The dtbo entries are the vendor tree's board overlays for the 40-pin
# header, both camera seats, the HaLow module and the Raspberry Pi 7" DSI
# panel.  They are opt-in - nothing is applied unless the boot environment
# selects it - and kernel-devicetree builds them from the vendor tree's
# dtbo-$(CONFIG_ARCH_ROCKCHIP) list.
KERNEL_DEVICETREE = " \
    rockchip/rk3588-recomputer-rk3588-devkit.dtb \
    rockchip/overlay/recomputer-rk3588-devkit-40pin-i2c3.dtbo \
    rockchip/overlay/recomputer-rk3588-devkit-40pin-pwm0_m1.dtbo \
    rockchip/overlay/recomputer-rk3588-devkit-40pin-pwm1_m1.dtbo \
    rockchip/overlay/recomputer-rk3588-devkit-40pin-pwm14.dtbo \
    rockchip/overlay/recomputer-rk3588-devkit-40pin-pwm15IR_m3.dtbo \
    rockchip/overlay/recomputer-rk3588-devkit-40pin-uart4.dtbo \
    rockchip/overlay/recomputer-rk3588-devkit-cam0-rpi-v2.dtbo \
    rockchip/overlay/recomputer-rk3588-devkit-cam0-rpi-v3.dtbo \
    rockchip/overlay/recomputer-rk3588-devkit-cam1-rpi-v2.dtbo \
    rockchip/overlay/recomputer-rk3588-devkit-cam1-rpi-v3.dtbo \
    rockchip/overlay/recomputer-rk3588-devkit-halow-wifi.dtbo \
    rockchip/overlay/recomputer-rk3588-devkit-raspi-7inch-touchscreen.dtbo \
"
UBOOT_EXTLINUX_FDT = "../rockchip/rk3588-recomputer-rk3588-devkit.dtb"
UBOOT_MACHINE = "recomputer-rk3588-devkit_defconfig"

# Firmware for the two PCIe RTL8125 ethernet ports: the r8169 driver requests
# rtl_nic/rtl8125a-3.fw / rtl8125b-2.fw at probe.  The rtl-nic package bundles
# the whole rtl_nic set.
# The rkaiq/rkisp camera 3A stack for RK3588 is built from source
# (rockchip-rkaiq / rockchip-rkisp recipes).
IMAGE_INSTALL:append = " \
    linux-firmware-rtl-nic \
    rockchip-rkaiq-server \
    rockchip-rkaiq-iqfiles \
    rockchip-rkisp-server \
    rockchip-rkisp-iqfiles \
"
