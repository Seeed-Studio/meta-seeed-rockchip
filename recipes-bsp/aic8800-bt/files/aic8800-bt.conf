# aic8800_btlpm has no modalias: module_init() self-registers its "aic-bt"
# platform device, so nothing ever autoloads it.  Its rfkill ("bluetooth")
# is what powers the combo's BT subsystem over SDIO (aicbsp_set_subsys) and
# is what aic8800-bt.service waits on.  hci_uart is NOT listed: hciattach's
# TIOCSETD auto-loads it via the "tty-ldisc-15" alias in modules.alias.
aic8800_btlpm
