# reComputer RK3576 DevKit specific kernel options.
# Both ethernet ports are SoC GMACs wired to RTL8211F PHYs (rgmii-rxid, see
# the board DTS).  STMMAC_ETH is in the vendor defconfig but the Rockchip
# platform glue (DWMAC_ROCKCHIP) and the Realtek PHY driver are not, and
# alldefconfig leaves them out - without them no eth interface ever
# appears.  Same silent-drop family as NF_CONNTRACK above.
CONFIG_STMMAC_ETH=y
CONFIG_DWMAC_ROCKCHIP=y
CONFIG_REALTEK_PHY=y
# The PCA9535 expander on i2c4 carries the user LED and camera/power
# enables referenced by the board DTS (gpio_xten), so it must be built in.
CONFIG_GPIO_PCA953X=y
# Mali-G52 GPU (Bifrost) uses the in-tree panfrost driver, mirroring the
# Seeed Armbian RK3576 kernel config (RECOMPUTER_GPU_STACK=panfrost).  The
# closed vendor kbase stacks are kept out; userspace stays in containers
# (Mesa), the OS only provides /dev/dri/renderD128.
CONFIG_DRM_PANFROST=y
# RK3576 uses the in-tree panfrost driver: keep the Rockchip kbase
# variants out, they would not build against this tree anyway.
# CONFIG_MALI_BIFROST is not set
# CONFIG_MALI_VALHALL is not set
# The raspi-7inch-touchscreen overlay needs three drivers the vendor
# defconfig leaves out: the Touch Display 2 panel ("raspberrypi,dsi-7inch",
# handled by the ILI9881C driver), its MCU regulator/gpiochip
# ("raspberrypi,v2-touchscreen-panel-regulator") and the GT911 touch IC
# ("goodix,gt911", mainline goodix driver).  Without the panel the
# dw-mipi-dsi2 component bind defers forever, which keeps the whole
# display-subsystem master from completing: the board would boot with no
# display DRM card at all (HDMI and DP included).
CONFIG_DRM_PANEL_ILITEK_ILI9881C=y
CONFIG_REGULATOR_RASPBERRYPI_TOUCHSCREEN_V2=y
CONFIG_TOUCHSCREEN_GOODIX=y
