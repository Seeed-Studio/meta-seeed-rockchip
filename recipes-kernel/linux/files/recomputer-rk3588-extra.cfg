# reComputer RK3588 DevKit specific kernel options.
# Both ethernet ports are PCIe RTL8125 NICs (pcie2x1l0/l2 in the board DTS,
# there is no SoC GMAC wiring on this board).  r8169 is the in-tree driver for
# them; without it no eth interface ever appears.  Armbian ships the same
# driver as =m.
CONFIG_R8169=y
# Mali-G610 GPU (vendor valhall kbase driver, matches the "arm,mali-valhall"
# DT node the board DTS already enables).  Mirrors the SDK's own rk3588.config
# fragment: the "rk" platform name selects the Rockchip power/clock glue.
# Userspace stays in containers (libmali), the OS only provides /dev/mali0.
CONFIG_MALI_VALHALL=y
CONFIG_MALI_VALHALL_PLATFORM_NAME="rk"
# The raspi-7inch-touchscreen overlay needs three drivers the vendor
# defconfig leaves out: the Touch Display 2 panel ("raspberrypi,dsi-7inch",
# handled by the ILI9881C driver), its MCU regulator/gpiochip
# ("raspberrypi,v2-touchscreen-panel-regulator") and the GT911 touch IC
# ("goodix,gt911", mainline goodix driver).  Without the panel the
# dw-mipi-dsi2 component bind defers forever, which keeps the whole
# display-subsystem master from completing: the board would boot with no
# display DRM card at all (HDMI and DP included).
CONFIG_DRM_PANEL_ILITEK_ILI9881C=y
CONFIG_REGULATOR_RASPBERRYPI_TOUCHSCREEN_V2=y
CONFIG_TOUCHSCREEN_GOODIX=y
